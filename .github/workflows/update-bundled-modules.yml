# ───────────────────────────────────────────────────────────────────────────────
# Update Bundled PowerShell Modules
# ───────────────────────────────────────────────────────────────────────────────
# Runs daily (and on manual dispatch) to check the PowerShell Gallery for newer
# versions of every module pinned in Build-BundledModules.ps1.  When an update
# is found the workflow:
#   1. Updates the pinned version in Build-BundledModules.ps1
#   2. Bumps the tool patch version in ArmClient-PS.ps1 and Build-BundledModules.ps1
#   3. Re-runs the build (regenerates Modules/, Versions.json, Files.sha256.json)
#   4. Commits and validates the exact archived package
#   5. Pushes the validated update to the default branch
# ───────────────────────────────────────────────────────────────────────────────

name: Update Bundled Modules

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:   # Allow manual trigger from the Actions tab

permissions:
  contents: write      # Required to push commits

jobs:
  check-and-update:
    name: Check for module updates
    runs-on: windows-latest   # Windows required for Save-Module / Save-PSResource compatibility
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Register PSGallery as trusted
        shell: pwsh
        run: |
          # Register the gallery when the runner does not already have it. Calling
          # Set-PSRepository on a missing source throws a terminating error that
          # -ErrorAction SilentlyContinue does not suppress, which previously
          # failed the whole job before any rebuild could happen.
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
              try { Register-PSRepository -Default -ErrorAction Stop } catch { Write-Output "Register-PSRepository -Default: $($_.Exception.Message)" }
          }
          if (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue) {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          }
          if (Get-Command -Name Get-PSResourceRepository -ErrorAction SilentlyContinue) {
              if (-not (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                  try { Register-PSResourceRepository -PSGallery -Trusted -ErrorAction Stop } catch { Write-Output "Register-PSResourceRepository -PSGallery: $($_.Exception.Message)" }
              }
              elseif (Get-Command -Name Set-PSResourceRepository -ErrorAction SilentlyContinue) {
                  Set-PSResourceRepository -Name PSGallery -Trusted -ErrorAction SilentlyContinue
              }
          }

      - name: Check for updates and rebuild
        id: update
        shell: pwsh
        run: |
          & '.github/scripts/Update-BundledModules.ps1' -Verbose

      - name: Create update commit
        if: steps.update.outputs.has_updates == 'true'
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all
          $summary = "${{ steps.update.outputs.commit_summary }}"
          $version = "${{ steps.update.outputs.new_tool_version }}"
          git commit -m "chore: update bundled modules ($summary) [v$version]"

      - name: Validate committed package
        if: steps.update.outputs.has_updates == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $validationRoot = Join-Path $env:RUNNER_TEMP 'ArmClient-PS-validation'
          $archivePath = Join-Path $env:RUNNER_TEMP 'ArmClient-PS-validation.zip'

          # Validate an archive of HEAD so Git attribute or line-ending changes
          # made while committing cannot differ from the files being tested.
          git archive --format=zip -o $archivePath HEAD
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to archive commit HEAD for package validation."
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $validationRoot
          & (Join-Path $validationRoot 'ArmClient-PS.ps1') -SelfTest -PreferBundledModules

      - name: Push validated update
        if: steps.update.outputs.has_updates == 'true'
        shell: pwsh
        run: |
          git push
